<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2 id="mode">Focus Time</h2>

  <!-- Phase 4.1: progress ring (two circles: a faint track and the colored progress) -->
  <div id="ring">
    <svg width="300" height="300" viewBox="0 0 300 300">
      <circle class="ring-track" cx="150" cy="150" r="130"></circle>
      <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="130"></circle>
    </svg>
    <div id="timer">25:00</div>
  </div>
  <div>
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
    <button onclick="switchMode()">Switch Mode</button>
  </div>
  <!-- Phase 4.4: task label -->
  <input type="text" id="taskInput" placeholder="What are you working on?" maxlength="60" oninput="saveTask()">

  <div id="sessions">Sessions completed: 0</div>
  <div id="message"></div>
  <div id="hint">Shortcuts: Space = start/pause, R = reset, S = switch mode</div>

  <!-- Phase 2.3 and 2.4: settings -->
  <div id="settings">
    <label>Focus (min) <input type="number" id="focusInput" value="25" min="1" max="180" onchange="applySettings()"></label>
    <label>Short break <input type="number" id="shortInput" value="5" min="1" max="180" onchange="applySettings()"></label>
    <label>Long break <input type="number" id="longInput" value="15" min="1" max="180" onchange="applySettings()"></label>
    <label><input type="checkbox" id="autoStartInput" onchange="applySettings()"> Auto-start next session</label>
    <button class="small" id="themeButton" onclick="toggleTheme()">Light mode</button>
  </div>

  <!-- Phase 3.3: history view -->
  <div id="history">
    <h3>History</h3>
    <div id="weekTotal"></div>
    <div id="historyList"></div>
    <h3 class="sub">Today's sessions</h3>
    <div id="todayList"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
