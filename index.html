<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Timer</title>
  <style>
    /* Colors live in variables so we can swap them per mode */
    :root {
      --bg: #1e1e2e;
      --text: #cdd6f4;
      --accent: #89b4fa;   /* blue = focus */
    }
    /* When <body> has class="break", these values override the ones above */
    body.break {
      --bg: #1e2e25;
      --accent: #a6e3a1;   /* green = break */
    }

    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: var(--bg); color: var(--text); transition: background 0.4s; }
    #mode { color: var(--accent); }
    #timer { font-size: 5rem; font-weight: bold; margin: 20px 0; }
    #message { min-height: 1.5rem; margin-top: 15px; color: var(--accent); font-weight: bold; }
    button { padding: 10px 20px; font-size: 1rem; margin: 5px; cursor: pointer; border: none; border-radius: 5px; background: var(--accent); color: #11111b; font-weight: bold; }
  </style>
</head>
<body>
  <h2 id="mode">Focus Time</h2>
  <div id="timer">25:00</div>
  <div>
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
    <button onclick="switchMode()">Switch Mode</button>
  </div>
  <div id="message"></div>

  <script>
    let isWorkMode = true;
    let timeLeft = 25 * 60;   // seconds remaining
    let timerId = null;
    let endTime = 0;          // the real clock time (ms) when the timer should hit 0

    // ---------- Display ----------
    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      const text = `${minutes}:${seconds}`;
      document.getElementById('timer').textContent = text;
      // Phase 1.2: show the countdown in the browser tab
      document.title = `${text} - ${isWorkMode ? 'Focus' : 'Break'}`;
    }

    // Phase 1.3: on-screen message + sound instead of alert()
    function showMessage(text) {
      document.getElementById('message').textContent = text;
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;   // pitch in Hz
        gain.gain.value = 0.2;       // volume (0 to 1)
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {
        // If the browser blocks sound, just skip it
      }
    }

    // ---------- Timer logic ----------
    // Phase 1.4: instead of "subtract 1 per tick", compare against the real clock
    function tick() {
      timeLeft = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
      updateDisplay();

      if (timeLeft === 0) {
        pauseTimer();
        const finishedFocus = isWorkMode;
        switchMode();   // switch first, because switchMode/reset clears the message
        showMessage(finishedFocus
          ? "Focus session complete! Time for a break."
          : "Break is over! Back to work.");
        playBeep();
      }
    }

    function startTimer() {
      if (timerId) return;
      showMessage('');
      endTime = Date.now() + timeLeft * 1000;
      timerId = setInterval(tick, 250);   // check often; the clock decides the time
    }

    function pauseTimer() {
      if (timerId) {
        // Save exactly how much time was left at the moment of pausing
        timeLeft = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
        updateDisplay();
      }
      clearInterval(timerId);
      timerId = null;
    }

    function resetTimer() {
      pauseTimer();
      showMessage('');
      timeLeft = isWorkMode ? 25 * 60 : 5 * 60;
      updateDisplay();
    }

    function switchMode() {
      isWorkMode = !isWorkMode;
      document.getElementById('mode').textContent = isWorkMode ? "Focus Time" : "Break Time";
      // Phase 1.1: add/remove the "break" class so CSS changes the colors
      document.body.classList.toggle('break', !isWorkMode);
      resetTimer();
    }

    updateDisplay();   // set the tab title right when the page loads
  </script>
</body>
</html>
