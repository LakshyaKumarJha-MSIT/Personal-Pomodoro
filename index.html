<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Timer</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1e1e2e; color: #cdd6f4; }
    #timer { font-size: 5rem; font-weight: bold; margin: 20px 0; }
    button { padding: 10px 20px; font-size: 1rem; margin: 5px; cursor: pointer; border: none; border-radius: 5px; background: #89b4fa; color: #11111b; font-weight: bold; }
  </style>
</head>
<body>
  <h2 id="mode">Focus Time</h2>
  <div id="timer">25:00</div>
  <div>
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
    <button onclick="switchMode()">Switch Mode</button>
  </div>

  <script>
    let isWorkMode = true;
    let timeLeft = 25 * 60;
    let timerId = null;

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer').textContent = `${minutes}:${seconds}`;
    }

    function startTimer() {
      if (timerId) return;
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          clearInterval(timerId);
          timerId = null;
          alert(isWorkMode ? "Focus session complete! Time for a break." : "Break is over! Back to work.");
          switchMode();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = isWorkMode ? 25 * 60 : 5 * 60;
      updateDisplay();
    }

    function switchMode() {
      isWorkMode = !isWorkMode;
      document.getElementById('mode').textContent = isWorkMode ? "Focus Time" : "Break Time";
      resetTimer();
    }
  </script>
</body>
</html>
