<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Timer</title>
  <style>
    /* Colors live in variables so we can swap them per mode */
    :root {
      --bg: #1e1e2e;
      --text: #cdd6f4;
      --accent: #89b4fa;   /* blue = focus */
    }
    body.short { --bg: #1e2e25; --accent: #a6e3a1; }   /* green = short break */
    body.long  { --bg: #2a1e2e; --accent: #cba6f7; }   /* purple = long break */

    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: var(--bg); color: var(--text); transition: background 0.4s; }
    #mode { color: var(--accent); }
    #timer { font-size: 5rem; font-weight: bold; margin: 20px 0; }
    #sessions { margin-top: 15px; opacity: 0.8; }
    #message { min-height: 1.5rem; margin-top: 10px; color: var(--accent); font-weight: bold; }
    button { padding: 10px 20px; font-size: 1rem; margin: 5px; cursor: pointer; border: none; border-radius: 5px; background: var(--accent); color: #11111b; font-weight: bold; }

    #settings { margin-top: 25px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 0.9rem; }
    #settings input[type="number"] { width: 55px; padding: 5px; border-radius: 5px; border: 1px solid var(--accent); background: transparent; color: var(--text); }
  </style>
</head>
<body>
  <h2 id="mode">Focus Time</h2>
  <div id="timer">25:00</div>
  <div>
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
    <button onclick="switchMode()">Switch Mode</button>
  </div>
  <div id="sessions">Sessions completed: 0</div>
  <div id="message"></div>

  <!-- Phase 2.3 and 2.4: settings -->
  <div id="settings">
    <label>Focus (min) <input type="number" id="focusInput" value="25" min="1" max="180" onchange="applySettings()"></label>
    <label>Short break <input type="number" id="shortInput" value="5" min="1" max="180" onchange="applySettings()"></label>
    <label>Long break <input type="number" id="longInput" value="15" min="1" max="180" onchange="applySettings()"></label>
    <label><input type="checkbox" id="autoStartInput" onchange="applySettings()"> Auto-start next session</label>
  </div>

  <script>
    // ---------- Settings (minutes) ----------
    const settings = {
      focus: 25,
      short: 5,
      long: 15,
      autoStart: false,
    };
    const SESSIONS_BEFORE_LONG_BREAK = 4;

    const LABELS = {
      focus: 'Focus Time',
      short: 'Short Break',
      long: 'Long Break',
    };

    // ---------- State: everything the app "remembers" ----------
    const state = {
      mode: 'focus',                    // 'focus' | 'short' | 'long'
      timeLeft: settings.focus * 60,    // seconds remaining
      sessionsCompleted: 0,
      timerId: null,
      endTime: 0,                       // real clock time (ms) when the timer should hit 0
    };

    // ---------- render(): update the whole page from state ----------
    function render() {
      const minutes = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
      const seconds = (state.timeLeft % 60).toString().padStart(2, '0');
      const text = `${minutes}:${seconds}`;

      document.getElementById('timer').textContent = text;
      document.getElementById('mode').textContent = LABELS[state.mode];
      document.getElementById('sessions').textContent = `Sessions completed: ${state.sessionsCompleted}`;
      document.title = `${text} - ${LABELS[state.mode]}`;

      // Colors: the body class decides which set of CSS variables applies
      document.body.classList.remove('short', 'long');
      if (state.mode !== 'focus') document.body.classList.add(state.mode);
    }

    function showMessage(text) {
      document.getElementById('message').textContent = text;
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {
        // If the browser blocks sound, just skip it
      }
    }

    // ---------- Modes ----------
    function setMode(mode) {
      state.mode = mode;
      resetTimer();
    }

    // Used when a session ends by itself: decides short vs long break
    function getNextMode() {
      if (state.mode !== 'focus') return 'focus';
      const isLongBreakDue = state.sessionsCompleted % SESSIONS_BEFORE_LONG_BREAK === 0;
      return isLongBreakDue ? 'long' : 'short';
    }

    // Used by the button: focus -> short break, any break -> focus
    // (skipping a focus session does not count as completed)
    function switchMode() {
      setMode(state.mode === 'focus' ? 'short' : 'focus');
    }

    // ---------- Timer logic ----------
    function tick() {
      state.timeLeft = Math.max(0, Math.ceil((state.endTime - Date.now()) / 1000));
      render();
      if (state.timeLeft === 0) finishSession();
    }

    function finishSession() {
      pauseTimer();
      const finishedMode = state.mode;

      if (finishedMode === 'focus') state.sessionsCompleted++;

      setMode(getNextMode());   // switch first, because reset clears the message

      if (finishedMode === 'focus') {
        const breakType = state.mode === 'long' ? 'long break' : 'break';
        showMessage(`Focus session ${state.sessionsCompleted} complete! Time for a ${breakType}.`);
      } else {
        showMessage('Break is over! Back to work.');
      }
      playBeep();

      if (settings.autoStart) startTimer(false);
    }

    function startTimer(clearMessage = true) {
      if (state.timerId) return;
      if (clearMessage) showMessage('');
      state.endTime = Date.now() + state.timeLeft * 1000;
      state.timerId = setInterval(tick, 250);
    }

    function pauseTimer() {
      if (state.timerId) {
        state.timeLeft = Math.max(0, Math.ceil((state.endTime - Date.now()) / 1000));
        render();
      }
      clearInterval(state.timerId);
      state.timerId = null;
    }

    function resetTimer() {
      pauseTimer();
      showMessage('');
      state.timeLeft = settings[state.mode] * 60;
      render();
    }

    // ---------- Settings handling ----------
    // Reads a number from an input; if it is invalid, keeps the old value
    function readMinutes(inputId, oldValue) {
      const value = parseInt(document.getElementById(inputId).value, 10);
      return value >= 1 && value <= 180 ? value : oldValue;
    }

    function applySettings() {
      settings.focus = readMinutes('focusInput', settings.focus);
      settings.short = readMinutes('shortInput', settings.short);
      settings.long = readMinutes('longInput', settings.long);
      settings.autoStart = document.getElementById('autoStartInput').checked;

      // Show the corrected values back in the boxes
      document.getElementById('focusInput').value = settings.focus;
      document.getElementById('shortInput').value = settings.short;
      document.getElementById('longInput').value = settings.long;

      // If the timer isn't running, update the current countdown to the new length
      if (!state.timerId) {
        state.timeLeft = settings[state.mode] * 60;
        render();
      }
    }

    render();   // draw the page for the first time
  </script>
</body>
</html>
